# Nginx configuration for Orion Starline AI Trading Platform
# Production-grade configuration with security, caching, and load balancing

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load dynamic modules
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/x-font-ttf
        font/opentype;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn_zone $server_name zone=conn_limit_per_server:10m;
    
    # Upstream definitions
    upstream backend {
        least_conn;
        server orion-backend-1:8000 max_fails=3 fail_timeout=30s weight=1;
        server orion-backend-2:8000 max_fails=3 fail_timeout=30s weight=1;
        server orion-backend-3:8000 max_fails=3 fail_timeout=30s weight=1;
        keepalive 32;
    }
    
    upstream websocket {
        server orion-backend-1:8000 max_fails=3 fail_timeout=30s weight=1;
        server orion-backend-2:8000 max_fails=3 fail_timeout=30s weight=1;
        server orion-backend-3:8000 max_fails=3 fail_timeout=30s weight=1;
    }
    
    # Cache configuration
    proxy_cache_path /var/cache/nginx/orion levels=1:2 keys_zone=orion_cache:100m max_size=1g inactive=60m use_temp_path=off;
    
    # Logging configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    
    # Health check endpoint
    server {
        listen 80 default_server;
        server_name _;
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Redirect HTTP to HTTPS in production
        # return 301 https://$server_name$request_uri;
    }
    
    # Main application server
    server {
        listen 80;
        server_name orion-starline.com www.orion-starline.com;
        
        # Redirect to HTTPS in production
        # return 301 https://$server_name$request_uri;
        
        # For now, allow HTTP for development
        
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        limit_conn conn_limit_per_ip 20;
        limit_conn conn_limit_per_server 1000;
        
        # Security settings
        client_max_body_size 100M;
        client_body_timeout 60s;
        client_header_timeout 60s;
        send_timeout 60s;
        
        # Static files with caching
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            
            # Enable compression for static files
            gzip_static on;
        }
        
        # Static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            
            # Rate limiting for static files
            limit_req zone=static burst=50 nodelay;
        }
        
        # Frontend routes - serve React app
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            
            # Cache control for HTML
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
            }
        }
        
        # API routes with caching
        location /api/ {
            # Rate limiting
            limit_req zone=api burst=50 nodelay;
            
            # Proxy settings
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Caching for GET requests
            proxy_cache orion_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $http_pragma $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
        }
        
        # Authentication endpoints with stricter rate limiting
        location /api/auth/ {
            limit_req zone=login burst=5 nodelay;
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable caching for auth endpoints
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
        
        # WebSocket support for real-time features
        location /ws {
            proxy_pass http://websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific settings
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;
        }
        
        # Admin endpoints with additional security
        location /api/admin/ {
            # Allow only from specific IPs in production
            # allow 192.168.1.0/24;
            # allow 10.0.0.0/8;
            # deny all;
            
            # Additional rate limiting
            limit_req zone=api burst=10 nodelay;
            
            # Require authentication
            # auth_basic "Admin Area";
            # auth_basic_user_file /etc/nginx/.htpasswd;
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # More restrictive timeouts for admin
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
        
        # Status page
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
        
        # Security.txt
        location = /.well-known/security.txt {
            return 200 "Contact: security@orion-starline.com\nExpires: 2024-12-31T23:59:59.000Z";
            add_header Content-Type text/plain;
        }
    }
    
    # API subdomain server
    server {
        listen 80;
        server_name api.orion-starline.com;
        
        # Rate limiting
        limit_req zone=api burst=100 nodelay;
        
        # CORS headers for API
        add_header Access-Control-Allow-Origin "https://orion-starline.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
        add_header Access-Control-Max-Age "86400" always;
        
        # Handle preflight requests
        location / {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API specific settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Disable caching for API
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
    }
    
    # Monitoring and metrics
    server {
        listen 8080;
        server_name monitoring.orion-starline.com;
        
        # Restrict access
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        # Prometheus metrics
        location /metrics {
            proxy_pass http://prometheus:9090/metrics;
            proxy_set_header Host $host;
        }
        
        # Grafana dashboard
        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
        }
        
        # Kibana
        location /kibana/ {
            proxy_pass http://kibana:5601/;
            proxy_set_header Host $host;
        }
    }
    
    # Load balancer health check server
    server {
        listen 8081;
        server_name _;
        
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}

# Stream configuration for TCP load balancing
stream {
    # Database connection pooling
    upstream postgres_backend {
        server postgres:5432 max_fails=3 fail_timeout=30s;
    }
    
    upstream redis_backend {
        server redis:6379 max_fails=3 fail_timeout=30s;
    }
    
    # PostgreSQL proxy
    server {
        listen 5433;
        proxy_pass postgres_backend;
        proxy_timeout 60s;
        proxy_responses 1;
        error_log /var/log/nginx/postgres_error.log;
    }
    
    # Redis proxy
    server {
        listen 6380;
        proxy_pass redis_backend;
        proxy_timeout 60s;
        proxy_responses 1;
        error_log /var/log/nginx/redis_error.log;
    }
}