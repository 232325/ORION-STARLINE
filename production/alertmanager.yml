# AlertManager Configuration
global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@orion-starline.com'
  smtp_auth_username: 'alerts@orion-starline.com'
  smtp_auth_password: 'smtp_password'
  resolve_timeout: 5m

# Route tree
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
    group_wait: 5s
    repeat_interval: 30m
  
  - match:
      severity: warning
    receiver: 'warning-alerts'
    group_wait: 1m
    repeat_interval: 2h
  
  - match:
      service: backend
    receiver: 'backend-team'
    routes:
    - match:
        severity: critical
      receiver: 'backend-critical'
  
  - match:
      service: frontend
    receiver: 'frontend-team'
    routes:
    - match:
        severity: critical
      receiver: 'frontend-critical'
  
  - match:
      service: database
    receiver: 'database-team'
    routes:
    - match:
        severity: critical
      receiver: 'database-critical'

# Inhibition rules
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

# Receivers
receivers:
  # Webhook for all alerts
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://orion-backend-service:8000/webhooks/alerts'
        send_resolved: true
        title: 'Orion Starline Alert'
        text: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Labels: {{ range .Labels.SortedPairs }} - {{ .Name }}: {{ .Value }}{{ end }}
          {{ end }}

  # Critical alerts
  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@orion-starline.com'
        subject: '[CRITICAL] Orion Starline Alert'
        body: |
          {{ range .Alerts }}
          🚨 CRITICAL ALERT
          
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          
          {{ if .Annotations.runbook_url }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
          {{ end }}
        headers:
          Priority: 'high'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts'
        title: 'Critical Alert'
        text: |
          {{ range .Alerts }}
          🚨 {{ .Annotations.summary }}
          
          {{ .Annotations.description }}
          
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          {{ end }}
        send_resolved: true

  # Warning alerts
  - name: 'warning-alerts'
    email_configs:
      - to: 'team@orion-starline.com'
        subject: '[WARNING] Orion Starline Alert'
        body: |
          {{ range .Alerts }}
          ⚠️ WARNING ALERT
          
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          {{ end }}
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#warnings'
        title: 'Warning Alert'
        text: |
          {{ range .Alerts }}
          ⚠️ {{ .Annotations.summary }}
          
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  # Backend team
  - name: 'backend-team'
    email_configs:
      - to: 'backend@orion-starline.com'
        subject: '[BACKEND] Orion Starline Alert'
        body: |
          {{ range .Alerts }}
          🔧 BACKEND ALERT
          
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          
          {{ if .Annotations.runbook_url }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
          {{ end }}

  # Backend critical
  - name: 'backend-critical'
    email_configs:
      - to: 'backend-critical@orion-starline.com'
        subject: '[CRITICAL BACKEND] Orion Starline Alert'
        body: |
          {{ range .Alerts }}
          🚨 CRITICAL BACKEND ALERT
          
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          
          IMMEDIATE ACTION REQUIRED!
          {{ if .Annotations.runbook_url }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
          {{ end }}
        headers:
          Priority: 'high'
    pagerduty_configs:
      - routing_key: 'YOUR_PAGERDUTY_INTEGRATION_KEY'
        description: 'Critical Backend Alert'

  # Frontend team
  - name: 'frontend-team'
    email_configs:
      - to: 'frontend@orion-starline.com'
        subject: '[FRONTEND] Orion Starline Alert'
        body: |
          {{ range .Alerts }}
          🎨 FRONTEND ALERT
          
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          {{ end }}

  # Frontend critical
  - name: 'frontend-critical'
    email_configs:
      - to: 'frontend-critical@orion-starline.com'
        subject: '[CRITICAL FRONTEND] Orion Starline Alert'
        body: |
          {{ range .Alerts }}
          🚨 CRITICAL FRONTEND ALERT
          
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          
          USER EXPERIENCE IS IMPACTED!
          {{ end }}
        headers:
          Priority: 'high'

  # Database team
  - name: 'database-team'
    email_configs:
      - to: 'database@orion-starline.com'
        subject: '[DATABASE] Orion Starline Alert'
        body: |
          {{ range .Alerts }}
          🗄️ DATABASE ALERT
          
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          {{ end }}

  # Database critical
  - name: 'database-critical'
    email_configs:
      - to: 'database-critical@orion-starline.com'
        subject: '[CRITICAL DATABASE] Orion Starline Alert'
        body: |
          {{ range .Alerts }}
          🚨 CRITICAL DATABASE ALERT
          
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          
          DATA INTEGRITY AT RISK!
          {{ if .Annotations.runbook_url }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
          {{ end }}
        headers:
          Priority: 'high'
    pagerduty_configs:
      - routing_key: 'YOUR_PAGERDUTY_DATABASE_KEY'
        description: 'Critical Database Alert'

  # SMS notifications for critical alerts
  - name: 'sms-critical'
    webhook_configs:
      - url: 'http://orion-backend-service:8000/webhooks/sms'
        send_resolved: true
        title: 'SMS Critical Alert'
        text: |
          🚨 CRITICAL: {{ .GroupLabels.alertname }}
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          Service: {{ .Labels.service }}
          {{ end }}

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Template functions
template_files:
  - |
    {{ define "slack.orion.text" }}{{ range .Alerts }}
    {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} *{{ .Annotations.summary }}*
    {{ .Annotations.description }}
    Service: {{ .Labels.service }}
    Severity: {{ .Labels.severity }}
    Instance: {{ .Labels.instance }}
    {{ if .Annotations.runbook_url }}[Runbook]({{ .Annotations.runbook_url }}){{ end }}
    {{ end }}{{ end }}


# Silence configuration
silence:
  - matchers:
      - service="backend"
      - severity="info"
    created_by: "Auto-silencer"
    comment: "Silenced by automation"
    starts_at: "2025-01-01T00:00:00Z"
    ends_at: "2025-12-31T23:59:59Z"