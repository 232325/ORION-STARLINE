# Kubernetes Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: orion-starline-prod
  labels:
    name: orion-starline-prod
    environment: production

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-backend
  namespace: orion-starline-prod
  labels:
    app: orion-backend
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orion-backend
  template:
    metadata:
      labels:
        app: orion-backend
        version: v1.0.0
    spec:
      containers:
      - name: backend
        image: ghcr.io/orion-starline/backend:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://orion-redis:6379"
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: supabase-url
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: supabase-anon-key
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: stripe-secret-key
        - name: PAYPAL_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: paypal-client-id
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      imagePullSecrets:
      - name: registry-secret

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-frontend
  namespace: orion-starline-prod
  labels:
    app: orion-frontend
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-frontend
  template:
    metadata:
      labels:
        app: orion-frontend
        version: v1.0.0
    spec:
      containers:
      - name: frontend
        image: ghcr.io/orion-starline/frontend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: VITE_API_URL
          value: "https://api.orion-starline.com"
        - name: VITE_STRIPE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: stripe-publishable-key
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
      imagePullSecrets:
      - name: registry-secret

---
# Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-postgres
  namespace: orion-starline-prod
  labels:
    app: orion-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-postgres
  template:
    metadata:
      labels:
        app: orion-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: postgres-db
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: postgres-password
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-redis
  namespace: orion-starline-prod
  labels:
    app: orion-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-redis
  template:
    metadata:
      labels:
        app: orion-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --requirepass
        - $(REDIS_PASSWORD)
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: redis-password
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc

---
# Monitoring Deployment (Prometheus)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-prometheus
  namespace: orion-starline-prod
  labels:
    app: orion-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-prometheus
  template:
    metadata:
      labels:
        app: orion-prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
          name: web
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
        - '--storage.tsdb.retention.time=30d'
        - '--web.enable-lifecycle'
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 8Gi
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        persistentVolumeClaim:
          claimName: prometheus-pvc

---
# Monitoring Deployment (Grafana)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-grafana
  namespace: orion-starline-prod
  labels:
    app: orion-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-grafana
  template:
    metadata:
      labels:
        app: orion-grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
          name: web
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: grafana-password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-config
          mountPath: /etc/grafana/provisioning
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 4Gi
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
      - name: grafana-config
        configMap:
          name: grafana-config

---
# Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-worker
  namespace: orion-starline-prod
  labels:
    app: orion-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-worker
  template:
    metadata:
      labels:
        app: orion-worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/orion-starline/backend:latest
        command: ["python", "-m", "worker"]
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://orion-redis:6379"
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
      imagePullSecrets:
      - name: registry-secret

---
# Scheduler Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-scheduler
  namespace: orion-starline-prod
  labels:
    app: orion-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-scheduler
  template:
    metadata:
      labels:
        app: orion-scheduler
    spec:
      containers:
      - name: scheduler
        image: ghcr.io/orion-starline/backend:latest
        command: ["python", "-m", "scheduler"]
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: orion-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://orion-redis:6379"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 800m
            memory: 2Gi
      imagePullSecrets:
      - name: registry-secret

---
# HPA (Horizontal Pod Autoscaler) for Backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orion-backend-hpa
  namespace: orion-starline-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orion-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# HPA for Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orion-frontend-hpa
  namespace: orion-starline-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orion-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
# HPA for Worker
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orion-worker-hpa
  namespace: orion-starline-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orion-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80