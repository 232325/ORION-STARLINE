---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orion-service-account
  namespace: orion-starline-prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/orion-starline-role

---
# Role and RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: orion-starline-prod
  name: orion-role
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orion-role-binding
  namespace: orion-starline-prod
subjects:
- kind: ServiceAccount
  name: orion-service-account
  namespace: orion-starline-prod
roleRef:
  kind: Role
  name: orion-role
  apiGroup: rbac.authorization.k8s.io