# Self-Learning Trading Fund System Configuration

# ==========================================
# SYSTEM CONFIGURATION
# ==========================================

system:
  name: "SelfLearningTradingFund"
  version: "1.0.0"
  environment: "development"  # development, staging, production
  timezone: "UTC"
  
# ==========================================
# LOGGING CONFIGURATION
# ==========================================

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/trading_system.log"
  max_size: "100MB"
  backup_count: 10
  
# ==========================================
# PERFORMANCE CONFIGURATION
# ==========================================

performance:
  initial_capital: 100000
  risk_per_trade: 0.02
  max_positions: 10
  stop_loss: 0.05
  take_profit: 0.10
  max_drawdown: 0.20
  sharpe_ratio_target: 1.5
  
# ==========================================
# DATA SOURCES CONFIGURATION
# ==========================================

data_sources:
  stocks:
    provider: "yahoo_finance"
    api_key: null  # Set your API key
    base_url: "https://query1.finance.yahoo.com"
    rate_limit: 100  # requests per minute
    
  forex:
    provider: "oanda_api"
    api_key: null  # Set your API key
    base_url: "https://api-fx.oanda.com"
    account_id: null  # Set your account ID
    
  crypto:
    provider: "binance_api"
    api_key: null  # Set your API key
    base_url: "https://api.binance.com"
    rate_limit: 1200  # requests per minute
    
  metals:
    provider: "metals_api"
    api_key: null  # Set your API key
    base_url: "https://api.metals.live"
    
# ==========================================
# REAL-TIME PROCESSING CONFIGURATION
# ==========================================

real_time:
  streaming:
    buffer_size: 1000
    processing_interval: 1  # seconds
    batch_size: 32
    
  updates:
    model_update_frequency: 3600  # seconds
    performance_check_interval: 300  # seconds
    alert_check_interval: 60  # seconds
    
# ==========================================
# BACKTESTING CONFIGURATION
# ==========================================

backtesting:
  start_date: "2020-01-01"
  end_date: "2023-12-31"
  initial_capital: 100000
  commission: 0.001  # 0.1%
  slippage: 0.0005   # 0.05%
  
# ==========================================
# RISK MANAGEMENT
# ==========================================

risk_management:
  position_sizing: "kelly_criterion"  # kelly_criterion, fixed_fraction, volatility_sizing
  max_correlation: 0.7
  var_confidence: 0.95  # Value at Risk confidence level
  portfolio_rebalance: "daily"  # daily, weekly, monthly
  
  emergency_stops:
    max_daily_loss: 0.05      # 5% daily loss limit
    max_drawdown: 0.20        # 20% max drawdown
    max_positions: 20         # Max number of positions
    connection_timeout: 300   # 5 minutes
  
# ==========================================
# ALERTING CONFIGURATION
# ==========================================

alerting:
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: null  # Set your email
    password: null  # Set your password
    recipients: []  # List of email addresses
    
  telegram:
    enabled: false
    bot_token: null  # Set your bot token
    chat_id: null    # Set your chat ID
    
  slack:
    enabled: false
    webhook_url: null  # Set your webhook URL
    
# ==========================================
# STORAGE CONFIGURATION
# ==========================================

storage:
  database:
    type: "sqlite"  # sqlite, postgresql, mysql
    path: "data/trading.db"
    backup_enabled: true
    backup_interval: 3600  # seconds
    
  model_storage:
    path: "models/"
    format: "pytorch"  # pytorch, tensorflow, sklearn
    versioning: true
    auto_cleanup: true
    
# ==========================================
# MONITORING CONFIGURATION
# ==========================================

monitoring:
  performance_metrics:
    - "sharpe_ratio"
    - "max_drawdown" 
    - "win_rate"
    - "profit_factor"
    - "calmar_ratio"
    
  alert_thresholds:
    sharpe_ratio: 1.0
    max_drawdown: 0.2
    win_rate: 0.4
    profit_factor: 1.2
    
  dashboard:
    enabled: false
    port: 8080
    refresh_interval: 30  # seconds
    
# ==========================================
# EXPORT CONFIGURATION
# ==========================================

export:
  reports:
    daily: true
    weekly: true
    monthly: true
    
  formats:
    - "csv"
    - "json"
    - "xlsx"
    
  path: "reports/"
  
# ==========================================
# DEVELOPMENT CONFIGURATION
# ==========================================

development:
  debug_mode: false
  profiling_enabled: false
  test_data_ratio: 0.2  # 20% for testing
  
  mock_trading:
    enabled: true
    simulate_latency: true
    latency_ms: 10
    
# ==========================================
# SECURITY CONFIGURATION
# ==========================================

security:
  api_keys_encryption: true
  sensitive_data_masking: true
  audit_logging: true
  
  access_control:
    admin_users: []  # List of admin users
    read_only_users: []  # List of read-only users
    
# ==========================================
# NETWORK CONFIGURATION
# ==========================================

network:
  timeout: 30  # seconds
  retry_attempts: 3
  retry_delay: 5  # seconds
  
  proxies:
    http: null
    https: null
    
# ==========================================
# FEATURE FLAGS
# ==========================================

feature_flags:
  multi_market_enabled: true
  cross_market_transfer: true
  concept_drift_detection: true
  online_learning: true
  ensemble_models: true
  real_time_updates: true
  ab_testing: false  # Disabled in development