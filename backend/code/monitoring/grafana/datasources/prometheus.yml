# =============================================================================
# AI Trading Evolution - Grafana Datasource Configuration
# =============================================================================
# Automatic datasource provisioning
# Author: MiniMax Agent
# Version: 1.0.0
# =============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"
