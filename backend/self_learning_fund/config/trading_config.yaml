# Trading Configuration for Self-Learning Trading Fund

# ==========================================
# TRADING INSTRUMENTS CONFIGURATION
# ==========================================

instruments:
  stocks:
    enabled: true
    symbols:
      - "AAPL"  # Apple Inc.
      - "GOOGL" # Alphabet Inc.
      - "MSFT"  # Microsoft Corporation
      - "AMZN"  # Amazon.com Inc.
      - "TSLA"  # Tesla Inc.
      - "NVDA"  # NVIDIA Corporation
      - "META"  # Meta Platforms Inc.
      - "NFLX"  # Netflix Inc.
      
    market_hours:
      pre_market: "04:00-09:30"
      regular: "09:30-16:00"
      after_market: "16:00-20:00"
      timezone: "America/New_York"
      
    trading_rules:
      min_order_size: 1
      max_order_size: 10000
      price_precision: 0.01
      
  forex:
    enabled: true
    pairs:
      major:
        - "EUR/USD"
        - "GBP/USD"
        - "USD/JPY"
        - "USD/CHF"
        - "AUD/USD"
        - "USD/CAD"
        - "NZD/USD"
      minor:
        - "EUR/GBP"
        - "EUR/JPY"
        - "EUR/CHF"
        - "GBP/JPY"
        - "GBP/CHF"
        
    market_sessions:
      sydney: "22:00-07:00"    # UTC
      tokyo: "00:00-09:00"     # UTC
      london: "08:00-17:00"    # UTC
      new_york: "13:00-22:00"  # UTC
      
    trading_rules:
      min_lot_size: 0.01
      max_lot_size: 100
      pip_size: 0.0001
      pip_value: 10  # USD per pip for standard lot
      
  crypto:
    enabled: true
    coins:
      major:
        - "BTC/USD"  # Bitcoin
        - "ETH/USD"  # Ethereum
        - "BNB/USD"  # Binance Coin
        - "ADA/USD"  # Cardano
        - "SOL/USD"  # Solana
        - "DOT/USD"  # Polkadot
        - "AVAX/USD" # Avalanche
        - "MATIC/USD" # Polygon
      defi:
        - "UNI/USD"   # Uniswap
        - "AAVE/USD"  # Aave
        - "COMP/USD"  # Compound
        
    trading_rules:
      min_order_size: 0.001  # BTC
      max_order_size: 10     # BTC
      price_precision: 0.01
      
    # 24/7 Trading
    trading_hours: "24/7"
    
  metals:
    enabled: true
    instruments:
      - "XAU/USD"  # Gold (troy ounce)
      - "XAG/USD"  # Silver (troy ounce)
      - "XPT/USD"  # Platinum (troy ounce)
      - "XPD/USD"  # Palladium (troy ounce)
      - "XCU/USD"  # Copper (pound)
      
    trading_rules:
      min_order_size: 1      # troy ounce
      max_order_size: 1000   # troy ounce
      price_precision: 0.01
      
    market_hours:
      london: "08:00-17:00"    # UTC
      new_york: "13:00-22:00"  # UTC
      
# ==========================================
# PORTFOLIO MANAGEMENT
# ==========================================

portfolio:
  # Position Sizing
  position_sizing:
    method: "kelly_criterion"  # kelly_criterion, fixed_fraction, volatility_sizing, risk_parity
    kelly_fraction: 0.25       # Conservative Kelly fraction
    max_position_size: 0.10    # Maximum 10% per position
    
  # Diversification
  diversification:
    max_positions_per_asset_class: 5
    max_correlation_threshold: 0.7
    rebalance_frequency: "daily"  # daily, weekly, monthly
    
  # Risk Limits
  risk_limits:
    max_portfolio_risk: 0.15    # 15% maximum portfolio risk
    max_sector_exposure: 0.30   # 30% max exposure per sector
    max_currency_exposure: 0.50 # 50% max exposure per currency
    
# ==========================================
# STRATEGY CONFIGURATION
# ==========================================

strategies:
  # Technical Analysis Strategy
  technical_analysis:
    enabled: true
    indicators:
      - name: "moving_average_crossover"
        short_ma: 10
        long_ma: 30
      - name: "rsi"
        period: 14
        overbought: 70
        oversold: 30
      - name: "macd"
        fast_period: 12
        slow_period: 26
        signal_period: 9
      - name: "bollinger_bands"
        period: 20
        std_dev: 2
      - name: "stochastic"
        k_period: 14
        d_period: 3
        
  # Machine Learning Strategy
  machine_learning:
    enabled: true
    model_type: "ensemble"  # single, ensemble, adaptive
    features:
      - "price_features"
      - "technical_indicators"
      - "sentiment_features"
      - "volume_features"
      
    prediction_horizon: 1  # days
    confidence_threshold: 0.7
    
  # Mean Reversion Strategy
  mean_reversion:
    enabled: false
    lookback_period: 20
    z_score_threshold: 2.0
    stop_loss: 0.05
    take_profit: 0.10
    
  # Momentum Strategy
  momentum:
    enabled: false
    lookback_period: 30
    momentum_threshold: 0.05
    holding_period: 5  # days
    
# ==========================================
# RISK MANAGEMENT
# ==========================================

risk_management:
  # Stop Loss Configuration
  stop_loss:
    default: 0.02      # 2% default stop loss
    adaptive: true     # Use volatility-based stops
    trailing: true     # Enable trailing stops
    trailing_distance: 0.01  # 1% trailing distance
    
  # Take Profit Configuration
  take_profit:
    default: 0.04      # 4% default take profit
    ratio: 2.0         # Risk:Reward ratio
    partial_exits: true # Take partial profits
    
  # Position Limits
  position_limits:
    max_positions: 20
    max_daily_trades: 10
    max_weekly_trades: 50
    
  # Drawdown Protection
  drawdown_protection:
    max_drawdown: 0.15      # 15% max drawdown
    daily_loss_limit: 0.03  # 3% daily loss limit
    weekly_loss_limit: 0.08 # 8% weekly loss limit
    
  # Correlation Risk
  correlation_risk:
    max_correlation: 0.7
    correlation_window: 30  # days
    correlation_rebalance: true
    
# ==========================================
# ORDER MANAGEMENT
# ==========================================

order_management:
  # Order Types
  order_types:
    market: true      # Market orders
    limit: true       # Limit orders
    stop: true        # Stop orders
    stop_limit: true  # Stop-limit orders
    
  # Order Routing
  routing:
    smart_routing: true
    routing_venue: "auto"  # auto, primary, secondary
    
  # Execution
  execution:
    time_in_force: "day"   # day, gtc, ioc, fok
    hidden_order: false    # Hidden order option
    iceberg_order: false   # Iceberg order option
    
  # Partial Fills
  partial_fills:
    enabled: true
    min_fill: 0.5         # Minimum 50% fill required
    cancel_time: 300      # Cancel after 5 minutes
    
# ==========================================
# MARKET DATA CONFIGURATION
# ==========================================

market_data:
  # Data Frequency
  frequency: "1min"  # tick, 1sec, 5sec, 1min, 5min, 15min, 1hour, 1day
  
  # Data Quality
  quality_control:
    outlier_detection: true
    missing_data_handling: "interpolate"  # drop, interpolate, forward_fill
    
  # Historical Data
  history:
    lookback_period: 1  # years
    data_retention: 5   # years
    
  # Real-time Data
  realtime:
    latency_target: 100  # milliseconds
    buffer_size: 1000
    update_frequency: 1  # seconds
    
# ==========================================
# BACKTESTING CONFIGURATION
# ==========================================

backtesting:
  # Date Range
  start_date: "2020-01-01"
  end_date: "2023-12-31"
  
  # Capital and Costs
  initial_capital: 100000
  commission: 0.001    # 0.1% commission
  slippage: 0.0005     # 0.05% slippage
  bid_ask_spread: 0.0001
  
  # Market Impact
  market_impact:
    enabled: true
    impact_model: "linear"  # linear, square_root, custom
    
  # Benchmark
  benchmark:
    enabled: true
    symbol: "SPY"  # S&P 500 ETF
    
  # Performance Metrics
  metrics:
    - "total_return"
    - "annualized_return"
    - "sharpe_ratio"
    - "max_drawdown"
    - "win_rate"
    - "profit_factor"
    - "calmar_ratio"
    - "sortino_ratio"
    
# ==========================================
# ALGO TRADING SETTINGS
# ==========================================

algo_trading:
  # Latency Requirements
  latency:
    max_latency: 100    # milliseconds
    target_latency: 50  # milliseconds
    
  # Throughput
  throughput:
    max_orders_per_second: 10
    max_positions: 20
    
  # High Frequency Trading
  hft:
    enabled: false
    min_holding_period: 1  # seconds
    
  # Smart Order Routing
  sor:
    enabled: true
    venue_selection: "best_price"  # best_price, fastest, smallest_spread
    
# ==========================================
# COMPLIANCE AND REGULATORY
# ==========================================

compliance:
  # Market Hours Compliance
  market_hours:
    strict_compliance: true
    after_hours_trading: false
    
  # Position Limits
  position_limits:
    per_security: 0.05    # 5% per security
    per_sector: 0.25      # 25% per sector
    total_portfolio: 1.0  # 100% total
    
  # Circuit Breakers
  circuit_breakers:
    enabled: true
    daily_limit: 0.07      # 7% daily loss limit
    volatility_pause: true
    
# ==========================================
# NOTIFICATION SETTINGS
# ==========================================

notifications:
  # Trade Notifications
  trades:
    enabled: true
    threshold: 1000  # USD value threshold
    
  # Risk Alerts
  risk_alerts:
    enabled: true
    drawdown_alert: 0.10      # 10% drawdown
    daily_loss_alert: 0.05    # 5% daily loss
    
  # System Alerts
  system:
    enabled: true
    connection_lost: true
    model_error: true
    data_quality: true
    
  # Methods
  methods:
    - "email"
    - "sms"
    - "push_notification"
    - "webhook"
    
# ==========================================
# MONITORING AND REPORTING
# ==========================================

monitoring:
  # Real-time Monitoring
  realtime:
    enabled: true
    refresh_interval: 5  # seconds
    
  # Performance Tracking
  performance:
    tracking_frequency: "daily"
    benchmark_comparison: true
    peer_comparison: false
    
  # Health Monitoring
  health:
    system_health: true
    data_quality: true
    model_performance: true
    
  # Reporting
  reporting:
    daily_report: true
    weekly_report: true
    monthly_report: true
    
    formats:
      - "pdf"
      - "excel"
      - "json"
      
# ==========================================
# ENVIRONMENT SPECIFIC SETTINGS
# ==========================================

environments:
  development:
    trading_enabled: false
    paper_trading: true
    debug_mode: true
    
  staging:
    trading_enabled: false
    paper_trading: true
    data_masking: true
    
  production:
    trading_enabled: true
    paper_trading: false
    high_availability: true
    disaster_recovery: true
    
# ==========================================
# INTEGRATION SETTINGS
# ==========================================

integrations:
  # Broker APIs
  broker:
    primary: "interactive_brokers"
    secondary: "alpaca"
    backup: "paper_trading"
    
  # Data Providers
  data_providers:
    primary: "bloomberg"
    secondary: "yahoo_finance"
    fallback: "alpha_vantage"
    
  # Risk Management
  risk_systems:
    compliance: "regtech_platform"
    surveillance: "market_surveillance"
    
# ==========================================
# SECURITY SETTINGS
# ==========================================

security:
  # API Security
  api_security:
    api_key_rotation: true
    rate_limiting: true
    ip_whitelist: []
    
  # Order Security
  order_security:
    order_validation: true
    duplicate_order_check: true
    max_order_size_check: true
    
  # Audit Trail
  audit_trail:
    enabled: true
    retention_period: 7  # years
    immutable_log: true
    
# ==========================================
# DISASTER RECOVERY
# ==========================================

disaster_recovery:
  # Backup Strategy
  backup:
    frequency: "hourly"
    retention: 30  # days
    offsite_backup: true
    
  # Failover
  failover:
    enabled: true
    secondary_system: "backup_trading_system"
    failover_time: 300  # seconds
    
  # Business Continuity
  business_continuity:
    max_downtime: 3600  # seconds (1 hour)
    manual_override: true