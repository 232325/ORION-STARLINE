# Smart Contract Security & Gas Optimization System
# Configuration file for Foundry development environment

[profile.default]
src = './contracts'
out = './out'
libs = ['./lib']
optimizer = true
optimizer_runs = 200
solc_version = '0.8.19'
via_ir = false
optimizer_enabled = true

# Test configuration
[profile.ci]
fuzz_runs = 10000
gas_reports = true
test_coverage = true
fail_fast = false

# Forking configuration
[profile.fork]
fork_url = 'https://mainnet.infura.io/v3/YOUR_INFURA_KEY'
fork_block_number = 15000000

[profile.testnet]
rpc_endpoints = {
    sepolia = 'https://sepolia.infura.io/v3/YOUR_INFURA_KEY',
    goerli = 'https://goerli.infura.io/v3/YOUR_INFURA_KEY',
    mumbai = 'https://polygon-mumbai.infura.io/v3/YOUR_INFURA_KEY'
}

[etherscan]
mainnet = { key = '${ETHERSCAN_API_KEY}' }
sepolia = { key = '${ETHERSCAN_API_KEY}' }
goerli = { key = '${ETHERSCAN_API_KEY}' }
polygon = { key = '${POLYGONSCAN_API_KEY}' }
polygon_mumbai = { key = '${POLYGONSCAN_API_KEY}' }

# Gas reporting
[gas_reports]
enabled = true
output_file = 'gas-report.txt'
report_summary = true

# Coverage reporting
[coverage]
enabled = true
output_file = 'coverage-report.json'
report_summary = true

# Solidity compiler configuration
[solidity]
version = '0.8.19'
optimizer_enabled = true
optimizer_runs = 200
via_ir = false
evm_version = 'paris'

# Linting configuration
[fmt]
line_length = 120
tab_width = 4
print_style = 'pretty'
number_underscore = 'thousands'
string_quote = 'double'
bracket_spacing = false
wrap_comments = false
ignore_imports = false

# Dependencies configuration
[dependencies]
# Core libraries
foundry = 'github:foundry-rs/foundry'
forge-std = 'github:forge-std/forge-std'
openzeppelin = 'github:OpenZeppelin/openzeppelin-contracts'

# Security libraries
solmate = 'github:transmissions11/solmate'
clones = 'github:thirdweb-dev/contracts'
Create2 = 'github:Arachnid/solidity-stringutils'

# Testing libraries
ds-test = 'github:dapphub/ds-test'
test-utils = 'github:foundry-rs/forge-std'