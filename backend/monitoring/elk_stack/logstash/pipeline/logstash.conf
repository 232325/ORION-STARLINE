# Logstash Configuration - Pipeline
# Application loglarini qayta ishlash va ElasticSearch ga yuborish

# Input configuration
input {
  # Filebeat input
  beats {
    port => 5044
  }
  
  # HTTP input for application logs
  http {
    port => 8080
    type => "application_logs"
  }
  
  # TCP input for structured logs
  tcp {
    port => 5000
    codec => json
    type => "structured_logs"
  }
  
  # UDP input for syslog
  udp {
    port => 5514
    codec => json
    type => "syslog"
  }
}

# Filter configuration
filter {
  # Application log processing
  if [type] == "application_logs" {
    # Add service and environment tags
    if [fields][service] {
      mutate {
        add_field => { "service" => "%{[fields][service]}" }
      }
    }
    
    if [fields][environment] {
      mutate {
        add_field => { "environment" => "%{[fields][environment]}" }
      }
    }
    
    # Parse JSON logs
    if [message] =~ /^[{[]/ {
      json {
        source => "message"
        target => "parsed_message"
      }
    }
    
    # Add timestamp if not present
    if ![@timestamp] {
      date {
        match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", "ISO8601" ]
      }
    }
    
    # Service-specific parsing
    if [service] == "trading_engine" {
      # Trading engine specific fields
      grok {
        match => { "message" => "Trade %{WORD:action}: %{NUMBER:trade_id} %{WORD:symbol} %{NUMBER:amount}" }
      }
      
      # Convert trade amount to number
      if [amount] {
        mutate {
          convert => { "amount" => "float" }
        }
      }
    }
    
    # API logs parsing
    if [service] == "api_gateway" {
      # Parse HTTP request information
      grok {
        match => { 
          "message" => "%{WORD:http_method} %{URIPATH:request_uri} HTTP/%{NUMBER:http_version}" 
        }
      }
      
      # Parse response time
      grok {
        match => { "message" => "Response time: %{NUMBER:response_time_ms}ms" }
        tag_on_failure => []
      }
      
      if [response_time_ms] {
        mutate {
          convert => { "response_time_ms" => "float" }
          add_field => { "response_time_seconds" => "%{response_time_ms}" }
        }
        ruby {
          code => "
            if event.get('response_time_ms')
              event.set('response_time_seconds', event.get('response_time_ms') / 1000.0)
            end
          "
        }
      }
    }
  }
  
  # Structured logs processing
  if [type] == "structured_logs" {
    # Add GeoIP information for IP addresses
    if [client_ip] {
      geoip {
        source => "client_ip"
        target => "geoip"
      }
    }
    
    # User agent parsing
    if [user_agent] {
      useragent {
        source => "user_agent"
        target => "user_agent_parsed"
      }
    }
  }
  
  # System logs processing
  if [type] == "syslog" {
    # Parse syslog format
    grok {
      match => { 
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{IPORHOST:syslog_server} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" 
      }
    }
    
    date {
      match => [ "syslog_timestamp", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss" ]
    }
  }
  
  # Error log processing
  if [level] == "ERROR" or [loglevel] == "ERROR" {
    mutate {
      add_tag => [ "error" ]
      add_field => { "severity" => "high" }
    }
    
    # Extract stack trace if present
    if [message] =~ /\n\s+at\s+/ {
      mutate {
        add_tag => [ "stack_trace" ]
      }
    }
  }
  
  # Warning logs
  if [level] == "WARNING" or [loglevel] == "WARNING" {
    mutate {
      add_tag => [ "warning" ]
      add_field => { "severity" => "medium" }
    }
  }
  
  # Critical logs
  if [level] == "CRITICAL" or [loglevel] == "CRITICAL" {
    mutate {
      add_tag => [ "critical" ]
      add_field => { "severity" => "critical" }
    }
  }
  
  # Database query logs
  if [message] =~ /SELECT|INSERT|UPDATE|DELETE/ {
    mutate {
      add_tag => [ "database" ]
    }
  }
  
  # HTTP request logs
  if [message] =~ /GET|POST|PUT|DELETE|PATCH/ {
    mutate {
      add_tag => [ "http_request" ]
    }
  }
  
  # Performance metrics extraction
  if [response_time_ms] {
    # Add performance indicators
    if [response_time_ms] < 100 {
      mutate {
        add_tag => [ "fast_response" ]
      }
    } else if [response_time_ms] < 500 {
      mutate {
        add_tag => [ "normal_response" ]
      }
    } else if [response_time_ms] < 1000 {
      mutate {
        add_tag => [ "slow_response" ]
      }
    } else {
      mutate {
        add_tag => [ "very_slow_response" ]
      }
    }
  }
  
  # Clean up fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input", "log" ]
  }
  
  # Add computed fields
  ruby {
    code => "
      # Add day of week
      event.set('day_of_week', Time.now.strftime('%A'))
      
      # Add hour of day
      event.set('hour_of_day', Time.now.hour)
      
      # Add log level category
      if event.get('level')
        level = event.get('level').downcase
        if ['error', 'critical', 'fatal'].include?(level)
          event.set('log_category', 'error')
        elsif level == 'warning'
          event.set('log_category', 'warning')
        else
          event.set('log_category', 'info')
        end
      end
    "
  }
}

# Output configuration
output {
  # Primary output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    
    # Document type (deprecated in ES 7+, but kept for compatibility)
    document_type => "_doc"
    
    # Template management
    template_name => "logs"
    template_pattern => "logs-*"
    template_overwrite => true
    
    # Routing based on log type
    routing => {
      "error" => "logs-error-%{+YYYY.MM.dd}"
      "warning" => "logs-warning-%{+YYYY.MM.dd}"
      "database" => "logs-database-%{+YYYY.MM.dd}"
      "http_request" => "logs-http-%{+YYYY.MM.dd}"
    }
  }
  
  # Debug output (optional)
  if [environment] == "development" {
    stdout {
      codec => rubydebug
    }
  }
  
  # Error logs to separate index for quick access
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "logs-errors-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
  
  # Slow queries to separate index
  if "very_slow_response" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "logs-slow-queries-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
  
  # Application metrics to separate index
  if [type] == "application_logs" and [service] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "logs-%{service}-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
}