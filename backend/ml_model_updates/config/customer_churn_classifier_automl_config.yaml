  - 32
  - 64
  - 128
  dropout:
  - 0.1
  - 0.2
  - 0.3
  - 0.5
  hidden_layers:
  - 2
  - 3
  - 4
  - 5
  learning_rate:
  - 0.001
  - 0.01
  - 0.1
timeout_hours: 24
